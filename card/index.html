<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>JF Champagne — Champagne Leadership &amp; Consulting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script>
/* ============================================================
   SETTINGS — edit these only
   ============================================================ */
var GA_MEASUREMENT_ID = 'G-DLZE8CDZLQ';   // GA4 Measurement ID (same as the main site)

// Print runs: the ?r= value printed in each QR code -> campaign name
var PRINT_RUNS = {
  '26': 'bizcard_2026'
  // '27': 'bizcard_2027'
};
var DEFAULT_CAMPAIGN = 'bizcard';          // used if ?r= is missing or unknown
var CARD_VERSION     = 'd2_bilingual';     // sent as utm_content

/* ============================================================
   1) Add campaign tags BEFORE Google Analytics loads,
      so the visit is attributed to the business card.
   ============================================================ */
(function () {
  var url = new URL(window.location.href);
  var p = url.searchParams;
  if (!p.get('utm_source')) {
    var run = p.get('r');
    p.set('utm_source', 'business_card');
    p.set('utm_medium', 'print');
    p.set('utm_campaign', (run && PRINT_RUNS[run]) || DEFAULT_CAMPAIGN);
    p.set('utm_content', CARD_VERSION);
    window.history.replaceState(null, '', url.pathname + '?' + p.toString() + url.hash);
  }
})();
</script>

<!-- 2) Google Analytics 4 -->
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){ dataLayer.push(arguments); }
(function () {
  if (!GA_MEASUREMENT_ID || GA_MEASUREMENT_ID.indexOf('XXXX') !== -1) return; // not configured yet
  var s = document.createElement('script');
  s.async = true;
  s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_MEASUREMENT_ID;
  document.head.appendChild(s);
  gtag('js', new Date());
  gtag('config', GA_MEASUREMENT_ID);
})();
</script>

<style>
  :root{
    --red:#C41E3A; --wine:#4A1C24; --burgundy:#8B1E3F;
    --cream:#FBF6EF; --pink:#F4CCCC; --black:#000; --white:#fff;
    --serif:'Playfair Display', Georgia, serif;
    --sans:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--cream);color:var(--black);font-family:var(--sans);-webkit-text-size-adjust:100%}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center}
  .wrap{width:100%;max-width:440px;padding:20px 20px 32px;display:flex;flex-direction:column;gap:20px;flex:1}
  .lang{display:flex;justify-content:flex-end;gap:4px}
  .lang button{font:600 13px var(--sans);letter-spacing:.06em;background:none;border:1px solid transparent;color:var(--wine);padding:8px 12px;border-radius:6px;cursor:pointer;min-height:44px}
  .lang button[aria-pressed="true"]{border-color:var(--wine)}
  .card{background:var(--white);border-radius:14px;padding:32px 24px 28px;text-align:center;box-shadow:0 1px 3px rgba(74,28,36,.08),0 8px 24px rgba(74,28,36,.06);display:flex;flex-direction:column;align-items:center;gap:6px}
  .card img{width:230px;max-width:80%;height:auto;margin-bottom:18px}
  h1{font:700 26px/1.2 var(--serif);margin:0}
  .creds{font-size:14px;color:var(--wine);letter-spacing:.04em}
  .title{font-size:15px;margin-top:4px}
  .btns{display:flex;flex-direction:column;gap:12px}
  .btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;border-radius:10px;font:600 16px var(--sans);text-decoration:none;padding:0 18px}
  .btn svg{width:20px;height:20px;flex-shrink:0}
  .btn-primary{background:var(--red);color:var(--white)}
  .btn-primary:active{background:#a8182f}
  .btn-secondary{background:var(--white);color:var(--wine);border:1.5px solid var(--wine)}
  .btn-ghost{background:transparent;color:var(--wine);border:1.5px solid rgba(74,28,36,.25)}
  .quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .quick a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;min-height:64px;border-radius:10px;background:var(--white);color:var(--wine);text-decoration:none;font-size:13px;font-weight:600}
  .quick svg{width:22px;height:22px}
  .tag{margin-top:auto;padding-top:12px;text-align:center}
  .tag .en{font:600 18px/1.3 var(--serif);color:var(--wine)}
  .tag .fr{font:400 15px/1.3 var(--serif);color:var(--burgundy);margin-top:4px}
  .rule{display:flex;align-items:center;gap:8px;margin:16px auto 0;max-width:220px}
  .rule i{flex:1;height:1px;background:var(--red)}
  .rule b{width:5px;height:5px;border-radius:50%;background:var(--red)}
  .pillars{font-size:12px;letter-spacing:.06em;color:var(--wine);margin-top:10px;text-align:center}
  a:focus-visible,button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">

  <div class="lang" role="group" aria-label="Language / Langue">
    <button type="button" data-set-lang="en" aria-pressed="true">EN</button>
    <button type="button" data-set-lang="fr" aria-pressed="false">FR</button>
  </div>

  <section class="card">
    <img id="logo" src="/champagne-leadership-horizontal-black2.svg" alt="Champagne Leadership &amp; Consulting">
    <h1>Jean-Francois (JF) Champagne</h1>
    <div class="creds">CAE, AAiP</div>
    <div class="title" data-i18n="title">Founder &amp; Principal Consultant</div>
  </section>

  <nav class="btns" aria-label="Actions">
    <a class="btn btn-primary" id="btn-save" href="jf-champagne.vcf">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
      <span data-i18n="save">Save contact</span>
    </a>
    <a class="btn btn-secondary" id="btn-book" href="https://calendly.com/jf-champagneleadership/30min" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      <span data-i18n="book">Book a call</span>
    </a>
    <a class="btn btn-ghost" id="btn-site" href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      <span data-i18n="site">Visit the website</span>
    </a>
  </nav>

  <nav class="quick" aria-label="Contact">
    <a id="q-call" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      <span data-i18n="call">Call</span>
    </a>
    <a id="q-email" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>
      <span data-i18n="email">Email</span>
    </a>
    <a id="q-li" href="https://www.linkedin.com/in/jfchampagne" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>
      <span>LinkedIn</span>
    </a>
  </nav>

  <footer class="tag">
    <div class="en" lang="en">Better boards. Stronger associations.</div>
    <div class="fr" lang="fr-CA">De meilleurs conseils. Des associations plus fortes.</div>
    <div class="rule" aria-hidden="true"><i></i><b></b><i></i></div>
    <div class="pillars" data-i18n="pillars">Governance · Leadership · Technology</div>
  </footer>

  <noscript><p style="text-align:center">ChampagneLeadership.ca</p></noscript>
</div>

<script>
/* ---------- 3) Contact details, assembled in the browser (not plain text for scrapers) ---------- */
(function () {
  var tel = ['+1', '613', '889', '5379'].join('');
  var mail = ['jf', 'champagneleadership.ca'].join('@');
  document.getElementById('q-call').href = 'tel:' + tel;
  document.getElementById('q-email').href = 'mailto:' + mail;
})();

/* ---------- 4) Bilingual: auto-detect from the phone, with EN | FR switch ---------- */
var T = {
  en: { title:'Founder & Principal Consultant', save:'Save contact', book:'Book a call',
        site:'Visit the website', call:'Call', email:'Email',
        pillars:'Governance · Leadership · Technology', home:'/', logo:'/champagne-leadership-horizontal-black2.svg', logoAlt:'Champagne Leadership & Consulting' },
  fr: { title:'Fondateur et consultant principal', save:'Enregistrer le contact', book:'Planifier un appel',
        site:'Visiter le site Web', call:'Appeler', email:'Courriel',
        pillars:'Gouvernance · Leadership · Technologie', home:'/fr/', logo:'/fr/champagne-leadership-horizontal-black-fr2.svg', logoAlt:'Champagne Leadership & Conseil' }
};
function setLang(l) {
  if (!T[l]) l = 'en';
  document.documentElement.lang = (l === 'fr') ? 'fr-CA' : 'en';
  document.querySelectorAll('[data-i18n]').forEach(function (el) { el.textContent = T[l][el.getAttribute('data-i18n')]; });
  document.querySelectorAll('[data-set-lang]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-set-lang') === l)); });
  document.getElementById('btn-site').href = T[l].home;
  var lg = document.getElementById('logo'); lg.src = T[l].logo; lg.alt = T[l].logoAlt;
  window.__lang = l;
}
(function () {
  var q = new URLSearchParams(location.search).get('lang');
  var nav = (navigator.languages && navigator.languages[0]) || navigator.language || 'en';
  setLang(q || (nav.toLowerCase().indexOf('fr') === 0 ? 'fr' : 'en'));
  document.querySelectorAll('[data-set-lang]').forEach(function (b) {
    b.addEventListener('click', function () { setLang(b.getAttribute('data-set-lang')); gtag('event', 'language_switch', { language: window.__lang }); });
  });
})();

/* ---------- 5) Track button taps as GA4 events ---------- */
function track(id, name) {
  var el = document.getElementById(id);
  el.addEventListener('click', function () {
    gtag('event', name, { language: window.__lang, transport_type: 'beacon' });
  });
}
track('btn-save', 'save_contact');
track('btn-book', 'book_call');
track('btn-site', 'visit_site');
track('q-call',   'click_call');
track('q-email',  'click_email');
track('q-li',     'click_linkedin');
</script>
</body>
</html>
